name: Deploy CSJ Service Layer

on:
  
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  APP_NAME: 'app-sj311react-api-poc-test'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: service-layer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Create deployment package
        run: |
          zip -r ../service-layer.zip . -x "node_modules/*"

      - name: Deploy to Azure Government App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_SERVICE_LAYER_PUBLISH_PROFILE }}
          package: service-layer.zip
