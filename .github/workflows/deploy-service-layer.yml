name: Deploy CSJ Service Layer

on:
  
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  APP_NAME: 'app-sj311react-api-poc-test'
  RESOURCE_GROUP: 'CSC-Demo'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: service-layer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Create deployment package
        run: |
          zip -r ../service-layer.zip . -x "node_modules/*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}
      - name: Configure App Service build and startup settings
        run: |
          az webapp config appsettings set --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true WEBSITE_NODE_DEFAULT_VERSION=~20 
          az webapp config set --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --linux-fx-version "NODE|20-lts" --startup-file "npm start"
      - name: Deploy to CSC API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: service-layer.zip
